name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ImmichDuplicateReview.slnx

      - name: Build
        run: dotnet build ImmichDuplicateReview.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ImmichDuplicateReview.slnx --configuration Release --no-build
