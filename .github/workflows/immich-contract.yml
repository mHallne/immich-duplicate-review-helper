name: Immich contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immich-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ImmichDuplicateReview.slnx

      - name: Build
        run: dotnet build ImmichDuplicateReview.slnx --configuration Release --no-restore

      - name: Test pinned Immich contract
        env:
          RUN_IMMICH_CONTRACT_TESTS: 1
        run: dotnet test ImmichDuplicateReview.slnx --configuration Release --no-build --filter Category=ImmichContract
